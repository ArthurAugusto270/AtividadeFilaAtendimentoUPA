<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fila UPA</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
<main class="container">
  <h1>Atendimento UPA</h1>
 
  <input type="hidden" id="indice">
 
  <input type="text" id="nome" placeholder="Nome do paciente">
  <input type="number" id="idade" placeholder="Idade">
  <input type="text" id="sintoma" placeholder="Sintoma">
 
  <select id="prioridade">
    <option value="">Classificação</option>
    <option value="vermelho">Vermelho (Urgente)</option>
    <option value="amarelo">Amarelo (Prioritário)</option>
    <option value="verde">Verde (Comum)</option>
  </select>
 
  <button onclick="salvarPaciente()">Cadastrar</button>
  <button onclick="chamarProximo()">Chamar Próximo</button>
  <button onclick="limparFila()">Limpar Fila</button>
 
  <h2>Fila de Pacientes</h2>
  <div id="listaPacientes"></div>
</main>
 
<script src="script.js"></script>
</body>
</html>
